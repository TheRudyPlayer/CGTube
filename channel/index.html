<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CGTube</title>

<link rel="icon" href="../images/chickenguntube_weblogo.png">

<style>

:root{
    --bg:#0f0f0f;
    --text:#fff;
    --sub:#aaa;
    --border:#303030;
    --card:#181818;
    --hover:#272727;
}

body.light{
    --bg:#fff;
    --text:#111;
    --sub:#666;
    --border:#ddd;
    --card:#f0f0f0;
    --hover:#eee;
}


*{
    box-sizing:border-box;
}


body{

    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;

}


.sidebar{

    position:fixed;
    left:0;
    top:0;

    width:72px;
    height:100vh;

    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;
    align-items:center;

}


.sidebar img{

    width:48px;
    height:48px;

    margin:15px;

}


.nav-btn{

    width:64px;
    height:60px;

    border:none;
    background:none;

    color:var(--text);

    cursor:pointer;

}


.nav-btn:hover{

    background:var(--hover);
    border-radius:12px;

}


.main{

    margin-left:72px;

}


/* BANNER */


.banner{

    width:100%;
    height:220px;

    background:#222;

}


.banner img{

    width:100%;
    height:100%;

    object-fit:cover;

}



/* INFO */


.channel-info{

    display:flex;

    gap:20px;

    padding:20px;

}


.channel-icon{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

}


.channel-name{

    font-size:32px;

    margin:0;

}


.handle{

    color:var(--sub);

}



/* VIDEOS */


.videos{

    padding:20px;

    display:grid;

    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

    gap:20px;

}


.video-card{

    cursor:pointer;

}


.video-card img{

    width:100%;

    border-radius:12px;

}


.video-card h3{

    margin:8px 0;

}


.video-card p{

    color:var(--sub);

}


</style>

</head>


<body>


<div class="sidebar">


<img src="../images/chickenguntube_weblogo.png">


<button class="nav-btn"
onclick="location.href='/CGTube/'">

⌂

</button>


<button class="nav-btn"
onclick="history.back()">

←

</button>


</div>



<div class="main">


<div class="banner">

<img id="banner">

</div>



<div class="channel-info">


<img id="icon"
class="channel-icon">


<div>


<h1 id="channelName"
class="channel-name">

Canal

</h1>


<p id="handle"
class="handle">

@canal

</p>


</div>


</div>



<div class="videos"
id="videos">

</div>


</div>


<script src="../CGTubeChannels.js"></script>
<script src="../CGTubeLinks.js"></script>


<script>


const params =
new URLSearchParams(location.search);


const channelId =
params.get("id");



let channel;

if(window.CGTubeChannels){

    channel = window.CGTubeChannels.find(
        c => c.id === channelId
    );

    alert("Canal: " + (channel ? channel.name : "NO ENCONTRADO"));

}
else{

    alert("NO CARGÓ LinkChannel.js");

}



if(!channel){

document.getElementById("videos").innerHTML =
"<h2>Canal no encontrado</h2>";

throw "";

}



document.title =
channel.name + " - CGTube";



document.getElementById("channelName")
.textContent =
channel.name;



document.getElementById("handle")
.textContent =
channel.handle;



document.getElementById("icon")
.src =
channel.icon;



document.getElementById("banner")
.src =
channel.banner || "";





const container =
document.getElementById("videos");


alert("Videos totales: " + window.CGTubeLinks.length);
const channelVideos =
window.CGTubeLinks.filter(
v => v.channelId === channelId
);
alert("Videos del canal: " + channelVideos.length);


channelVideos.forEach(video=>{


const id =
video.url
.split("v=")[1]
?.split("&")[0];



container.innerHTML += `

<div class="video-card"
onclick="location.href='../watch/?v=${id}'">


<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">


<h3>${video.title}</h3>


<p>${channel.name}</p>


</div>

`;


});



</script>


</body>

</html>
